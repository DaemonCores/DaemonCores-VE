[Unit]
# pvefw-logger opens /var/log/pve-firewall.log when it starts. The unit is
# DefaultDependencies=no and only ordered After=local-fs.target, which does
# NOT require the mount units of local-fs.target to have SUCCEEDED: when the
# /var/log btrfs mount fails or loses its race, the file sits on the
# read-only composefs layer and the start dies with
# "unable to open file '/var/log/pve-firewall.log': Read-only file system"
# (both arches, floating between builds — CI runs 41451549641, 41455682594).
# Requiring the mount makes the failure load-bearing and explicit: if
# var-log.mount fails, THIS unit fails with the mount dependency error and
# the image no longer boots green with an unwritable /var/log.
RequiresMountsFor=/var/log