# pve-firewall.service ships in the pve-firewall deb with the systemd 90s
# default and no start timeout of its own. On the slow arm64 guests the perl
# firewall stack (PVE::Storage plugins, legacy iptables alternates) still
# loads past 90s: run e566948 measured 'pve-firewall.service: start
# operation timed out' ~97s into the boot (arm64, QEMU TCG), the same class
# of cascade as pvestatd/pveproxy before them (run 41447423140). A generous
# start timeout only ever delays a stuck start — the image boot test gates
# an actual hang.
[Service]
TimeoutStartSec=600