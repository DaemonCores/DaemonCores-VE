# pve-ha-crm and pve-ha-lrm measure no start timeout of their own (90s
# systemd default). On slow arm64 guests (QEMU TCG) the HA daemons load
# their perl stack past 90s: run 41473422898 measured pve-ha-crm terminated
# at start+90s while the daemon reached wait_for_quorum. A generous start
# timeout only ever delays a stuck start — the image boot test gates an
# actual hang. Same class as the pvestatd/pveproxy/pve-firewall drop-ins.
[Service]
TimeoutStartSec=600
