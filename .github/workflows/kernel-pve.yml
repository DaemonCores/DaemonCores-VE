name: Kernel PVE + XanMod (DEPRECATED)

# DEPRECATED — the production path is the deb pipeline:
# DaemonCores-VE workflows/bootc-debs-builder/packages.yml, kernel-pve class
# entry (one variant per microarch level; debs published to the DaemonCores
# APT repo like any other package). This workflow exists ONLY for the
# in-flight kernel validation lane, which runs its build through it as
# workflow artifacts; it must be removed once that lane lands, so there is
# exactly ONE way to build the kernel. The weekly cron is gone — manual
# dispatch only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: DaemonCores/DaemonCores-CI/.github/workflows/kernel-pve.yml@main
    with:
      manifest-repo: DaemonCores/DaemonCores-VE
      manifest-ref: main
      kernel-series: "7.3"