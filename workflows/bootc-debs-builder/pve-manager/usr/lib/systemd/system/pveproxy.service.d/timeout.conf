# TimeoutStartSec=600
# pveproxy runs an apt-update task at startup (measured in the boot test
# diag) and the arm64 runners boot several times slower than the amd64
# ones: the systemd 90s default killed the start operation there before
# the proxy ever came active, and every queued start (dc-zramctl waits on
# multi-user.target) cascaded behind it. A generous start timeout only
# delays a stuck start — the image boot test gates an actual hang (run
# 41447423140).
[Service]
TimeoutStartSec=600