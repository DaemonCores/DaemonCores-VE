# [Service]
# TimeoutStartSec=600
# amd64 first boots settle the Proxmox daemons well inside the systemd 90s
# default; the arm64 image test measured pvestatd still loading its storage
# plugins past the timeout (systemd killed the start operation, cascading the
# queued dc-zramctl start behind multi-user.target) and pveproxy killed the
# same way. A generous start timeout only ever delays a stuck start — the
# image boot test gates an actual hang (run 41447423140).
[Service]
TimeoutStartSec=600