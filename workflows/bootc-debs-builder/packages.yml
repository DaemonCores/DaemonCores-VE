# Package manifest for the bootc .deb builder.
# One entry per package. Consumed by the generic bootc-debs-builder workflow
# (setup computes dependency waves) and by the build-one-deb reusable workflow.
#   name       logical package name
#   upstream   apt package to repack (omit for from-source / custom packages)
#   deps       packages that must be built+installed first (creates a wave)
#   sources    paths under workflows/bootc-debs-builder/ hashed for change
#   deb-glob   output deb glob when it differs from <name>_* (also per-variant)
#   env        non-secret KEY: VALUE exported for the build (also hashed)
#   secret-env ENV_VAR: SECRET_NAME injected from secrets (never hashed)
#   build      the exact build script, verbatim
# Shared repack logic lives in lib/deb-overlays.sh (debian-bootc lib/ convention:
# sourced, hashed via sources). Package dirs mirror the deb tree: new files are
# real files, modified upstream files are git .patch at the mirrored path,
# applied by deb_overlay_apply (all-or-nothing dry-run first, .patch never
# shipped). Overlay trees without patches use ifupdown2postinstall-style copy
# (deb_overlay_tree); whole-tree custom packages use deb_custom.
packages:
  - name: ifupdown2
    upstream: ifupdown2
    sources:
      - ifupdown2postinstall
      - lib/deb-overlays.sh
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)

      . "${SAVE_PWD}/workflows/bootc-debs-builder/lib/deb-overlays.sh"

      apt-get update
      cd /tmp
      apt-get download ifupdown2

      ORIG_VER=$(dpkg-deb -f /tmp/ifupdown2_*.deb Version)
      ARCH=$(dpkg-deb -f /tmp/ifupdown2_*.deb Architecture)

      deb_overlay_tree ifupdown2 "${ORIG_VER}" "${ARCH}" +bootc5 \
        ifupdown2postinstall \
        usr/sbin/ifupdown2-autoconf usr/sbin/domain-set

  - name: chrony
    upstream: chrony
    sources:
      - chronypostinstall
      - lib/deb-overlays.sh
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)

      . "${SAVE_PWD}/workflows/bootc-debs-builder/lib/deb-overlays.sh"

