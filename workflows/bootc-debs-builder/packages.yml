# Package manifest for the bootc .deb builder.
# One entry per package. Consumed by the generic bootc-debs-builder workflow
# (setup computes dependency waves) and by the build-one-deb reusable workflow.
#   name       logical package name
#   upstream   apt package to repack (omit for from-source / custom packages)
#   deps       packages that must be built+installed first (creates a wave)
#   sources    paths under workflows/bootc-debs-builder/ hashed for change
#   deb-glob   output deb glob when it differs from <name>_*
#   env        non-secret KEY: VALUE exported for the build (also hashed)
#   secret-env ENV_VAR: SECRET_NAME injected from secrets (never hashed)
#   build      the exact build script, verbatim
# Gabriel spec 2026-10-30: repacked upstreams call the shared helpers in
# DaemonCores-CI/scripts (repack_deb.sh = mirror overlay + git .patch apply;
# overlay_tree_deb.sh = pure file-tree overlay; custom_deb.sh = whole custom
# DEBIAN/+usr/ tree). Package dirs mirror the deb tree; modified files are
# git-format .patch at the mirror path of the file they patch.
packages:
  - name: ifupdown2
    upstream: ifupdown2
    sources:
      - ifupdown2postinstall
    build: |
      $CI_SCRIPTS/overlay_tree_deb.sh ifupdown2 ifupdown2postinstall +bootc5 \
        usr/sbin/ifupdown2-autoconf usr/sbin/domain-set
  - name: chrony
    upstream: chrony
    sources:
      - chronypostinstall
    build: |
      $CI_SCRIPTS/overlay_tree_deb.sh chrony chronypostinstall +bootc2
  - name: openipmi
    upstream: openipmi
    sources:
      - openipmipostinstall
    build: |
      $CI_SCRIPTS/overlay_tree_deb.sh openipmi openipmipostinstall +bootc1
  - name: libtemplate-perl
    upstream: libtemplate-perl
    sources:
      - libtemplate-perl
    build: |
      $CI_SCRIPTS/repack_deb.sh libtemplate-perl libtemplate-perl +bootc1
  - name: libpve-storage-perl
    upstream: libpve-storage-perl
    sources:
      - libpve-storage-perl
    build: |
      $CI_SCRIPTS/repack_deb.sh libpve-storage-perl libpve-storage-perl +dcve1
  - name: pve-manager
    upstream: pve-manager
    sources:
      - pve-manager
    build: |
      $CI_SCRIPTS/repack_deb.sh pve-manager pve-manager +bootc1
  - name: qemu-server
    upstream: qemu-server
    sources:
      - qemu-server
    build: |
      $CI_SCRIPTS/repack_deb.sh qemu-server qemu-server +bootc1
  - name: proxmox-kernel-helper
    upstream: proxmox-kernel-helper
    build: |
      # bespoke content surgery (grub-install / triggers removal): kept
      # verbatim until its overlay mirror is generated (PENDING).
      SAVE_PWD=$(pwd)
      apt update
      cd /tmp
      apt-get download proxmox-kernel-helper
      O=/output/proxmox-kernel-helper
      mkdir -p "$O"
      dpkg-deb -R /tmp/proxmox-kernel-helper_*.deb "$O"
      ORIG_VER=$(dpkg-deb -f /tmp/proxmox-kernel-helper_*.deb Version)
      ARCH=$(dpkg-deb -f /tmp/proxmox-kernel-helper_*.deb Architecture)
      rm -f "$O/usr/sbin/grub-install" "$O/etc/grub.d/000_proxmox_boot_header" \
        "$O/etc/initramfs/post-update.d/proxmox-boot-sync" \
        "$O/etc/kernel/postinst.d/zz-proxmox-boot" \
        "$O/etc/kernel/postrm.d/zz-proxmox-boot" "$O/DEBIAN/triggers"
      for s in preinst postinst prerm postrm; do
        printf '#!/bin/sh\nset -e\nexit 0\n' > "$O/DEBIAN/$s"; chmod 0755 "$O/DEBIAN/$s"
      done
      printf '%s\n' /etc/kernel/postinst.d/proxmox-auto-removal \
        /etc/kernel/postrm.d/proxmox-auto-removal > "$O/DEBIAN/conffiles"
      test ! -e "$O/usr/sbin/grub-install" && test ! -e "$O/DEBIAN/triggers"
      find "$O" -not -path '*/DEBIAN/*' -type f | xargs md5sum | sed "s|$O/||" > "$O/DEBIAN/md5sums"
      sed -i "s/^Version: .*/Version: 1:${ORIG_VER}+bootc1/" "$O/DEBIAN/control"
      dpkg-deb --build "$O" /debs/proxmox-kernel-helper_${ORIG_VER}+bootc1_${ARCH}.deb
  - name: fanctl
    sources:
      - fanctl
    env:
      FANCTL_VER: 1.2.1
    build: |
      $CI_SCRIPTS/custom_deb.sh fanctl
  - name: powerctl
    sources:
      - powerctl
    env:
      POWERCTL_VER: 1.1.0
    build: |
      $CI_SCRIPTS/custom_deb.sh powerctl
  - name: dc-firewall-seed
    sources:
      - dc-firewall-seed
    env:
      DC_FIREWALL_SEED_VER: 1.0.0
    build: |
      $CI_SCRIPTS/custom_deb.sh dc-firewall-seed
  - name: dc-config-zfs
    sources:
      - dc-config-zfs
    env:
      DC_CONFIG_ZFS_VER: 1.0.0
    build: |
      $CI_SCRIPTS/custom_deb.sh dc-config-zfs
  - name: dc-zramctl
    sources:
      - dc-zramctl
    env:
      DC_ZRAMCTL_VER: 1.0.0
    build: |
      $CI_SCRIPTS/custom_deb.sh dc-zramctl
  - name: pvect-ostree
    sources:
      - pvect-ostree
    env:
      PVECT_OSTREE_VER: 1.0.0
    build: |
      $CI_SCRIPTS/custom_deb.sh pvect-ostree
  - name: compose2bootc
    sources:
      - compose2bootc
    env:
      COMPOSE2BOOTC_VER: 0.1.0
    build: |
      $CI_SCRIPTS/custom_deb.sh compose2bootc
