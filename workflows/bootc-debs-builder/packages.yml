# Package manifest for the bootc .deb builder.
# Build scripts are single physical lines (\n escaped) — the generic repack calls the shared apply_overlays helper.
packages:
- name: ifupdown2
  upstream: ifupdown2
  sources:
  - ifupdown2postinstall
  build: "SAVE_PWD=$(pwd)\n\napt update\ncd /tmp\napt-get download ifupdown2\n\nmkdir -p /output/ifupdown2\ndpkg-deb -R /tmp/ifupdown2_*.deb /output/ifupdown2\n\nORIG_VER=$(dpkg-deb -f /tmp/ifupdown2_*.deb Version)\n\ncp -r \"${SAVE_PWD}\"/workflows/bootc-debs-builder/ifupdown2postinstall/* \\\n  /output/ifupdown2/\n\n# Regenerate md5sums after content modification\nfind /output/ifupdown2 -not -path '*/DEBIAN/*' -type f \\\n  | xargs md5sum \\\n  | sed \"s|/output/ifupdown2/||\" \\\n  > /output/ifupdown2/DEBIAN/md5sums\n\n# Preserve +pmx suffix for pve-manager version check\nsed -i \"s/^Version: .*/Version: 2:${ORIG_VER}+bootc5/\" \\\n  /output/ifupdown2/DEBIAN/control\nchmod +x /output/ifupdown2/usr/sbin/ifupdown2-autoconf \\\n  /output/ifupdown2/usr/sbin/domain-set\n\n# Content check: version bumped and our helpers present + executable.\ngrep -qF \"Version: 2:${ORIG_VER}+bootc5\" \\\n  /output/ifupdown2/DEBIAN/control \\\n  || { echo \"ERROR: ifupdown2 version not rewritten\" >&2; exit 1; }\nfor s in ifupdown2-autoconf domain-set; do\n  test -s \"/output/ifupdown2/usr/sbin/${s}\" \\\n    && test -x \"/output/ifupdown2/usr/sbin/${s}\" \\\n    || { echo \"ERROR: ifupdown2 ${s} missing/not exec\" >&2; exit 1; }\ndone\n\ndpkg-deb --build /output/ifupdown2 \\\n  /debs/ifupdown2_${ORIG_VER}+bootc5_all.deb\n"
- name: chrony
  upstream: chrony
  sources:
  - chronypostinstall
  build: "SAVE_PWD=$(pwd)\n\napt update\ncd /tmp\napt-get download chrony\n\nmkdir -p /output/chrony\ndpkg-deb -R /tmp/chrony_*.deb /output/chrony\n\nORIG_VER=$(dpkg-deb -f /tmp/chrony_*.deb Version)\nARCH=$(dpkg-deb -f /tmp/chrony_*.deb Architecture)\n\ncp -r \"${SAVE_PWD}\"/workflows/bootc-debs-builder/chronypostinstall/* \\\n  /output/chrony/\n\n# Regenerate md5sums after content modification\nfind /output/chrony -not -path '*/DEBIAN/*' -type f \\\n  | xargs md5sum \\\n  | sed \"s|/output/chrony/||\" \\\n  > /output/chrony/DEBIAN/md5sums\n\nsed -i \"s/^Version: .*/Version: 1:${ORIG_VER}+bootc2/\" \\\n  /output/chrony/DEBIAN/control\n\n# Content check: version rewritten in control.\ngrep -qF \"Version: 1:${ORIG_VER}+bootc2\" \\\n  /output/chrony/DEBIAN/control \\\n  || { echo \"ERROR: chrony version not rewritten\" >&2; exit 1; }\n\ndpkg-deb --build /output/chrony \\\n  /debs/chrony_${ORIG_VER}+bootc2_${ARCH}.deb\n"
- name: openipmi
  upstream: openipmi
  sources:
  - openipmipostinstall
  build: "SAVE_PWD=$(pwd)\n\napt update\ncd /tmp\napt-get download openipmi\n\nmkdir -p /output/openipmi\ndpkg-deb -R /tmp/openipmi_*.deb /output/openipmi\n\nORIG_VER=$(dpkg-deb -f /tmp/openipmi_*.deb Version)\nARCH=$(dpkg-deb -f /tmp/openipmi_*.deb Architecture)\n\ncp -r \"${SAVE_PWD}\"/workflows/bootc-debs-builder/openipmipostinstall/* \\\n  /output/openipmi/\n\n# Regenerate md5sums after content modification\nfind /output/openipmi -not -path '*/DEBIAN/*' -type f \\\n  | xargs md5sum \\\n  | sed \"s|/output/openipmi/||\" \\\n  > /output/openipmi/DEBIAN/md5sums\n\nsed -i \"s/^Version: .*/Version: 1:${ORIG_VER}+bootc1/\" \\\n  /output/openipmi/DEBIAN/control\n\n# Content check: version rewritten in control.\ngrep -qF \"Version: 1:${ORIG_VER}+bootc1\" \\\n  /output/openipmi/DEBIAN/control \\\n  || { echo \"ERROR: openipmi version not rewritten\" >&2; exit 1; }\n\ndpkg-deb --build /output/openipmi \\\n  /debs/openipmi_${ORIG_VER}+bootc1_${ARCH}.deb\n"
- name: libtemplate-perl
  upstream: libtemplate-perl
  sources:
  - libtemplate-perl
  build: "SAVE_PWD=$(pwd)\nPKG=libtemplate-perl\nVER_SUFFIX=+bootc1\n\napt update\ncd /tmp\napt-get download \"${PKG}\"\n\nO=/output/${PKG}\nmkdir -p \"$O\"\ndpkg-deb -R /tmp/${PKG}_*.deb \"$O\"\n\nORIG_VER=$(dpkg-deb -f /tmp/${PKG}_*.deb Version)\nARCH=$(dpkg-deb -f /tmp/${PKG}_*.deb Architecture)\n\n# Generic overlay build (Gabriel spec 2026-10-30): the package directory is\n# an exact mirror of the deb tree - new files are real files copied as-is;\n# modified upstream files are git-format patches at the MIRROR PATH of the\n# file they patch, applied by the ONE generic patch loop in the shared DaemonCores-CI script\n# (hunks are the anchors, drift is patch refusing to apply). A non-zero\n# return = drift: skip without building and let build-deb.sh fall back to\n# the last-good deb.\nset +e\n\"$CI_SCRIPTS/apply_overlays.sh\" \\\n  \"${SAVE_PWD}/workflows/bootc-debs-builder/${PKG}\" \"$O\"\nrc=$?\nset -e\nif [ \"$rc\" -ne 0 ]; then\n  echo \"${PKG} skipped (overlay drift) - last-good version retained.\"\n  exit 0\nfi\n\n# Regenerate md5sums after content modification\nfind \"$O\" -not -path '*/DEBIAN/*' -type f \\\n  | xargs md5sum \\\n  | sed \"s|$O/||\" \\\n  > \"$O/DEBIAN/md5sums\"\n\nsed -i \"s/^Version: .*/Version: 1:${ORIG_VER}${VER_SUFFIX}/\" \\\n  \"$O/DEBIAN/control\"\n\ndpkg-deb --build \"$O\" \\\n  /debs/${PKG}_${ORIG_VER}${VER_SUFFIX}_${ARCH}.deb\n"
- name: libpve-storage-perl
  upstream: libpve-storage-perl
  sources:
  - libpve-storage-perl
  build: "SAVE_PWD=$(pwd)\nPKG=libpve-storage-perl\nVER_SUFFIX=+dcve1\n\napt update\ncd /tmp\napt-get download \"${PKG}\"\n\nO=/output/${PKG}\nmkdir -p \"$O\"\ndpkg-deb -R /tmp/${PKG}_*.deb \"$O\"\n\nORIG_VER=$(dpkg-deb -f /tmp/${PKG}_*.deb Version)\nARCH=$(dpkg-deb -f /tmp/${PKG}_*.deb Architecture)\n\n# Generic overlay build (Gabriel spec 2026-10-30): the package directory is\n# an exact mirror of the deb tree - new files are real files copied as-is;\n# modified upstream files are git-format patches at the MIRROR PATH of the\n# file they patch, applied by the ONE generic patch loop in the shared DaemonCores-CI script\n# (hunks are the anchors, drift is patch refusing to apply). A non-zero\n# return = drift: skip without building and let build-deb.sh fall back to\n# the last-good deb.\nset +e\n\"$CI_SCRIPTS/apply_overlays.sh\" \\\n  \"${SAVE_PWD}/workflows/bootc-debs-builder/${PKG}\" \"$O\"\nrc=$?\nset -e\nif [ \"$rc\" -ne 0 ]; then\n  echo \"${PKG} skipped (overlay drift) - last-good version retained.\"\n  exit 0\nfi\n\n# Regenerate md5sums after content modification\nfind \"$O\" -not -path '*/DEBIAN/*' -type f \\\n  | xargs md5sum \\\n  | sed \"s|$O/||\" \\\n  > \"$O/DEBIAN/md5sums\"\n\nsed -i \"s/^Version: .*/Version: 1:${ORIG_VER}${VER_SUFFIX}/\" \\\n  \"$O/DEBIAN/control\"\n\ndpkg-deb --build \"$O\" \\\n  /debs/${PKG}_${ORIG_VER}${VER_SUFFIX}_${ARCH}.deb\n"
- name: pve-manager
  upstream: pve-manager
  sources:
  - pve-manager
  build: "SAVE_PWD=$(pwd)\nPKG=pve-manager\nVER_SUFFIX=+bootc1\n\napt update\ncd /tmp\napt-get download \"${PKG}\"\n\nO=/output/${PKG}\nmkdir -p \"$O\"\ndpkg-deb -R /tmp/${PKG}_*.deb \"$O\"\n\nORIG_VER=$(dpkg-deb -f /tmp/${PKG}_*.deb Version)\nARCH=$(dpkg-deb -f /tmp/${PKG}_*.deb Architecture)\n\n# Generic overlay build (Gabriel spec 2026-10-30): the package directory is\n# an exact mirror of the deb tree - new files are real files copied as-is;\n# modified upstream files are git-format patches at the MIRROR PATH of the\n# file they patch, applied by the ONE generic patch loop in the shared DaemonCores-CI script\n# (hunks are the anchors, drift is patch refusing to apply). A non-zero\n# return = drift: skip without building and let build-deb.sh fall back to\n# the last-good deb.\nset +e\n\"$CI_SCRIPTS/apply_overlays.sh\" \\\n  \"${SAVE_PWD}/workflows/bootc-debs-builder/${PKG}\" \"$O\"\nrc=$?\nset -e\nif [ \"$rc\" -ne 0 ]; then\n  echo \"${PKG} skipped (overlay drift) - last-good version retained.\"\n  exit 0\nfi\n\n# Regenerate md5sums after content modification\nfind \"$O\" -not -path '*/DEBIAN/*' -type f \\\n  | xargs md5sum \\\n  | sed \"s|$O/||\" \\\n  > \"$O/DEBIAN/md5sums\"\n\nsed -i \"s/^Version: .*/Version: 1:${ORIG_VER}${VER_SUFFIX}/\" \\\n  \"$O/DEBIAN/control\"\n\ndpkg-deb --build \"$O\" \\\n  /debs/${PKG}_${ORIG_VER}${VER_SUFFIX}_${ARCH}.deb\n"
- name: qemu-server
  upstream: qemu-server
  sources:
  - qemu-server
  build: "SAVE_PWD=$(pwd)\nPKG=qemu-server\nVER_SUFFIX=+bootc1\n\napt update\ncd /tmp\napt-get download \"${PKG}\"\n\nO=/output/${PKG}\nmkdir -p \"$O\"\ndpkg-deb -R /tmp/${PKG}_*.deb \"$O\"\n\nORIG_VER=$(dpkg-deb -f /tmp/${PKG}_*.deb Version)\nARCH=$(dpkg-deb -f /tmp/${PKG}_*.deb Architecture)\n\n# Generic overlay build (Gabriel spec 2026-10-30): the package directory is\n# an exact mirror of the deb tree - new files are real files copied as-is;\n# modified upstream files are git-format patches at the MIRROR PATH of the\n# file they patch, applied by the ONE generic patch loop in the shared DaemonCores-CI script\n# (hunks are the anchors, drift is patch refusing to apply). A non-zero\n# return = drift: skip without building and let build-deb.sh fall back to\n# the last-good deb.\nset +e\n\"$CI_SCRIPTS/apply_overlays.sh\" \\\n  \"${SAVE_PWD}/workflows/bootc-debs-builder/${PKG}\" \"$O\"\nrc=$?\nset -e\nif [ \"$rc\" -ne 0 ]; then\n  echo \"${PKG} skipped (overlay drift) - last-good version retained.\"\n  exit 0\nfi\n\n# Regenerate md5sums after content modification\nfind \"$O\" -not -path '*/DEBIAN/*' -type f \\\n  | xargs md5sum \\\n  | sed \"s|$O/||\" \\\n  > \"$O/DEBIAN/md5sums\"\n\nsed -i \"s/^Version: .*/Version: 1:${ORIG_VER}${VER_SUFFIX}/\" \\\n  \"$O/DEBIAN/control\"\n\ndpkg-deb --build \"$O\" \\\n  /debs/${PKG}_${ORIG_VER}${VER_SUFFIX}_${ARCH}.deb\n"
- name: proxmox-kernel-helper
  upstream: proxmox-kernel-helper
  build: "apt update\ncd /tmp\napt-get download proxmox-kernel-helper\n\nO=/output/proxmox-kernel-helper\nmkdir -p \"$O\"\ndpkg-deb -R /tmp/proxmox-kernel-helper_*.deb \"$O\"\n\nORIG_VER=$(dpkg-deb -f /tmp/proxmox-kernel-helper_*.deb Version)\nARCH=$(dpkg-deb -f /tmp/proxmox-kernel-helper_*.deb Architecture)\n\n# proxmox-boot-tool's job — owning the ESP bootloader and syncing kernels\n# onto it (incl. multi-ESP redundancy) — is exactly bootupd's job, and\n# bootc MANDATES bootupd (it runs it on every install). Two ESP managers\n# are mutually exclusive, so on a bootc image proxmox-boot-tool is\n# superseded and can never be the active bootloader manager: it is out of\n# scope here. We therefore drop only its automatic boot integration (the\n# grub-install diversion, the grub.d / initramfs / kernel ESP-sync hooks,\n# and the dpkg triggers that fire them) which would otherwise contend with\n# bootupd over the ESP. The proxmox-boot-tool binary itself and the kernel\n# NeverAutoRemove hooks (proxmox-auto-removal) are kept, and the proxmox-ve\n# dependency stays satisfied. The deb's md5sums are regenerated below so the\n# repacked package stays consistent (re-signed).\n\n# 1. Drop the grub-install wrapper and the proxmox-boot-tool hooks.\nrm -f \\\n  \"$O/usr/sbin/grub-install\" \\\n  \"$O/etc/grub.d/000_proxmox_boot_header\" \\\n  \"$O/etc/initramfs/post-update.d/proxmox-boot-sync\" \\\n  \"$O/etc/kernel/postinst.d/zz-proxmox-boot\" \\\n  \"$O/etc/kernel/postrm.d/zz-proxmox-boot\"\n\n# 2. No dpkg triggers: the package must not react to grub/shim changes.\nrm -f \"$O/DEBIAN/triggers\"\n\n# 3. Keep only the two proxmox-auto-removal conffiles.\nprintf '%s\\n' \\\n  /etc/kernel/postinst.d/proxmox-auto-removal \\\n  /etc/kernel/postrm.d/proxmox-auto-removal \\\n  > \"$O/DEBIAN/conffiles\"\n\n# 4. Neutral maintainer scripts: no grub-install diversion, no\n#    proxmox-boot-tool reinit. The kept conffiles are managed by dpkg\n#    directly and need no registration.\nfor s in preinst postinst prerm postrm; do\n  printf '#!/bin/sh\\nset -e\\nexit 0\\n' > \"$O/DEBIAN/$s\"\n  chmod 0755 \"$O/DEBIAN/$s\"\ndone\n\n# Guard: the grub-install wrapper and dpkg triggers must be gone.\ntest ! -e \"$O/usr/sbin/grub-install\" \\\n  || { echo \"ERROR: grub-install wrapper still present.\" >&2; exit 1; }\ntest ! -e \"$O/DEBIAN/triggers\" \\\n  || { echo \"ERROR: dpkg triggers still present.\" >&2; exit 1; }\n\n# Regenerate md5sums after content modification\nfind \"$O\" -not -path '*/DEBIAN/*' -type f \\\n  | xargs md5sum \\\n  | sed \"s|$O/||\" \\\n  > \"$O/DEBIAN/md5sums\"\n\nsed -i \"s/^Version: .*/Version: 1:${ORIG_VER}+bootc1/\" \"$O/DEBIAN/control\"\n\ndpkg-deb --build \"$O\" \\\n  /debs/proxmox-kernel-helper_${ORIG_VER}+bootc1_${ARCH}.deb\n"
- name: fanctl
  sources:
  - fanctl
  env: "FANCTL_VER: 1.2.1"
  build: "SAVE_PWD=$(pwd)\n\nmkdir -p /output/fanctl\ncp -r \"${SAVE_PWD}\"/workflows/bootc-debs-builder/fanctl/* /output/fanctl/\n\nchmod 0755 /output/fanctl/usr/sbin/fanctl\nchmod 0755 /output/fanctl/DEBIAN/postinst\n\nsed -i \\\n  -e \"s|{{ VER }}|${FANCTL_VER}|g\" \\\n  -e \"s|, {{ DEPS }}||g\" \\\n  /output/fanctl/DEBIAN/control\n\n# Content check: template expanded + scripts present/executable/valid.\no=/output/fanctl\n! grep -q '{{' \"${o}/DEBIAN/control\" \\\n  || { echo \"ERROR: fanctl control has unexpanded template\" >&2; exit 1; }\nfor f in \"${o}/usr/sbin/fanctl\" \"${o}/DEBIAN/postinst\"; do\n  test -x \"${f}\" \\\n    || { echo \"ERROR: fanctl ${f} missing/not exec\" >&2; exit 1; }\n  if head -1 \"${f}\" | grep -qE '^#!.*sh'; then\n    bash -n \"${f}\" \\\n      || { echo \"ERROR: fanctl ${f} shell syntax\" >&2; exit 1; }\n  fi\ndone\n\ndpkg-deb --build /output/fanctl \\\n  /debs/fanctl_${FANCTL_VER}_all.deb\n"
