packages:
- name: ifupdown2
  upstream: ifupdown2
  sources:
  - ifupdown2postinstall
  build: "SAVE_PWD=$(pwd)\n\napt update\ncd /tmp\napt-get download ifupdown2\n\nmkdir -p /output/ifupdown2\ndpkg-deb -R /tmp/ifupdown2_*.deb /output/ifupdown2\n\nORIG_VER=$(dpkg-deb -f /tmp/ifupdown2_*.deb Version)\n\ncp -r \"${SAVE_PWD}\"/workflows/bootc-debs-builder/ifupdown2postinstall/* \\\n  /output/ifupdown2/\n\n# Regenerate md5sums after content modification\nfind /output/ifupdown2 -not -path '*/DEBIAN/*' -type f \\\n  | xargs md5sum \\\n  | sed \"s|/output/ifupdown2/||\" \\\n  > /output/ifupdown2/DEBIAN/md5sums\n\n# Preserve +pmx suffix for pve-manager version check\nsed -i \"s/^Version: .*/Version: 2:${ORIG_VER}+bootc5/\" \\\n  /output/ifupdown2/DEBIAN/control\nchmod +x /output/ifupdown2/usr/sbin/ifupdown2-autoconf \\\n  /output/ifupdown2/usr/sbin/domain-set\n\n# Content check: version bumped and our helpers present + executable.\ngrep -qF \"Version: 2:${ORIG_VER}+bootc5\" \\\n  /output/ifupdown2/DEBIAN/control \\\n  || { echo \"ERROR: ifupdown2 version not rewritten\" >&2; exit 1; }\nfor s in ifupdown2-autoconf domain-set; do\n  test -s \"/output/ifupdown2/usr/sbin/${s}\" \\\n    && test -x \"/output/ifupdown2/usr/sbin/${s}\" \\\n    || { echo \"ERROR: ifupdown2 ${s} missing/not exec\" >&2; exit 1; }\ndone\n\ndpkg-deb --build /output/ifupdown2 \\\n  /debs/ifupdown2_${ORIG_VER}+bootc5_all.deb\n"
- name: chrony
  upstream: chrony
  sources:
  - chronypostinstall
  build: "SAVE_PWD=$(pwd)\n\napt update\ncd /tmp\napt-get download chrony\n\nmkdir -p /output/chrony\ndpkg-deb -R /tmp/chrony_*.deb /output/chrony\n\nORIG_VER=$(dpkg-deb -f /tmp/chrony_*.deb Version)\nARCH=$(dpkg-deb -f /tmp/chrony_*.deb Architecture)\n\ncp -r \"${SAVE_PWD}\"/workflows/bootc-debs-builder/chronypostinstall/* \\\n  /output/chrony/\n\n# Regenerate md5sums after content modification\nfind /output/chrony -not -path '*/DEBIAN/*' -type f \\\n  | xargs md5sum \\\n  | sed \"s|/output/chrony/||\" \\\n  > /output/chrony/DEBIAN/md5sums\n\nsed -i \"s/^Version: .*/Version: 1:${ORIG_VER}+bootc2/\" \\\n  /output/chrony/DEBIAN/control\n\n# Content check: version rewritten in control.\ngrep -qF \"Version: 1:${ORIG_VER}+bootc2\" \\\n  /output/chrony/DEBIAN/control \\\n  || { echo \"ERROR: chrony version not rewritten\" >&2; exit 1; }\n\ndpkg-deb --build /output/chrony \\\n  /debs/chrony_${ORIG_VER}+bootc2_${ARCH}.deb\n"
- name: openipmi
  upstream: openipmi
  sources:
  - openipmipostinstall
  build: "SAVE_PWD=$(pwd)\n\napt update\ncd /tmp\napt-get download openipmi\n\nmkdir -p /output/openipmi\ndpkg-deb -R /tmp/openipmi_*.deb /output/openipmi\n\nORIG_VER=$(dpkg-deb -f /tmp/openipmi_*.deb Version)\nARCH=$(dpkg-deb -f /tmp/openipmi_*.deb Architecture)\n\ncp -r \"${SAVE_PWD}\"/workflows/bootc-debs-builder/openipmipostinstall/* \\\n  /output/openipmi/\n\n# Regenerate md5sums after content modification\nfind /output/openipmi -not -path '*/DEBIAN/*' -type f \\\n  | xargs md5sum \\\n  | sed \"s|/output/openipmi/||\" \\\n  > /output/openipmi/DEBIAN/md5sums\n\nsed -i \"s/^Version: .*/Version: 1:${ORIG_VER}+bootc1/\" \\\n  /output/openipmi/DEBIAN/control\n\n# Content check: version rewritten in control.\ngrep -qF \"Version: 1:${ORIG_VER}+bootc1\" \\\n  /output/openipmi/DEBIAN/control \\\n  || { echo \"ERROR: openipmi version not rewritten\" >&2; exit 1; }\n\ndpkg-deb --build /output/openipmi \\\n  /debs/openipmi_${ORIG_VER}+bootc1_${ARCH}.deb\n"
- name: libtemplate-perl
  upstream: libtemplate-perl
  build: "apt update\ncd /tmp\napt-get download libtemplate-perl\n\nmkdir -p /output/libtemplate-perl\ndpkg-deb -R /tmp/libtemplate-perl_*.deb /output/libtemplate-perl\n\nORIG_VER=$(dpkg-deb -f /tmp/libtemplate-perl_*.deb Version)\nARCH=$(dpkg-deb -f /tmp/libtemplate-perl_*.deb Architecture)\n\n# ostree canonicalizes every /usr file mtime to 0 (epoch) at deploy\n# time. Template Toolkit's _template_modified returns that mtime and\n# its caller uses the value as the \"does this template exist?\" truth:\n# a zero mtime is falsy, so every template shipped under /usr is\n# reported missing and the Proxmox VE web UI answers HTTP 500\n# (\"index.html.tpl: not found\"). Map a real-but-zero mtime to 1\n# (truthy and stable, so the freshness cache never thrashes) while\n# still returning undef for genuinely absent files.\nPROV=$(find /output/libtemplate-perl -path '*/Template/Provider.pm')\ngrep -qF 'return (stat( $template ))[9];' \"$PROV\" \\\n  || { echo \"ERROR: libtemplate-perl _template_modified changed upstream; patch needs review.\" >&2; exit 1; }\nsed -i 's#return (stat( $template ))\\[9\\];#my @arr = stat($template); return @arr ? ($arr[9] || 1) : undef;#' \"$PROV\"\ngrep -qF 'my @arr = stat($template); return @arr ? ($arr[9] || 1) : undef;' \"$PROV\" \\\n  || { echo \"ERROR: libtemplate-perl mtime patch failed to apply.\" >&2; exit 1; }\n# Compile-check the patched module. The package is only extracted here,\n# not installed, so add its own tree to @INC to resolve the sibling\n# Template::* modules (e.g. Template::Base) it inherits from.\nperl -I \"$(dirname \"$(dirname \"$PROV\")\")\" -c \"$PROV\" \\\n  || { echo \"ERROR: patched Provider.pm fails perl -c.\" >&2; exit 1; }\n\n# Regenerate md5sums after content modification\nfind /output/libtemplate-perl -not -path '*/DEBIAN/*' -type f \\\n  | xargs md5sum \\\n  | sed \"s|/output/libtemplate-perl/||\" \\\n  > /output/libtemplate-perl/DEBIAN/md5sums\n\nsed -i \"s/^Version: .*/Version: 1:${ORIG_VER}+bootc1/\" \\\n  /output/libtemplate-perl/DEBIAN/control\n\ndpkg-deb --build /output/libtemplate-perl \\\n  /debs/libtemplate-perl_${ORIG_VER}+bootc1_${ARCH}.deb\n"
- name: libpve-storage-perl
  upstream: libpve-storage-perl
  build: "SAVE_PWD=$(pwd)\n\napt update\n# The guarded patch script compile-checks two PVE:: Perl modules after\n# patching; their sibling modules (libpve-common-perl and friends) must\n# be present in the builder for `perl -c` to be meaningful.\napt install -y --no-install-recommends \\\n  libpve-common-perl libjson-perl libnet-ip-perl\ncd /tmp\napt-get download libpve-storage-perl\n\nmkdir -p /output/libpve-storage-perl\ndpkg-deb -R /tmp/libpve-storage-perl_*.deb /output/libpve-storage-perl\n\nORIG_VER=$(dpkg-deb -f /tmp/libpve-storage-perl_*.deb Version)\nARCH=$(dpkg-deb -f /tmp/libpve-storage-perl_*.deb Architecture)\n\n# Guarded patches (libtemplate-perl model: inline, no patch dir): mount\n# every zpool created through the API/GUI under /mnt/<pool> (the bootc\n# / is a read-only OSTree root) and align the ZFSPoolPlugin path()\n# fallback. An upstream refactor that moves an anchor SKIPS the deb\n# (last-good +bootc build retained, step summary + issue, job not failed).\nO=/output/libpve-storage-perl\nZ=\"$O/usr/share/perl5/PVE/API2/Disks/ZFS.pm\"\nPP=\"$O/usr/share/perl5/PVE/Storage/ZFSPoolPlugin.pm\"\n\nskip_pkg() {\n  local reason=\"$1\"\n  echo \"::error title=libpve-storage-perl patch drift::${reason}\"\n  {\n    echo \"### \u26D4 libpve-storage-perl not rebuilt \u2014 patch drift\"\n    echo\n    echo \"**${reason}**\"\n    echo\n    echo \"An upstream refactor moved a patch anchor, so libpve-storage-perl\"\n    echo \"was **skipped**. The last-good \\`+bootc\\` build is kept; the\"\n    echo \"unpatched upstream is never shipped.\"\n  } >>\"${GITHUB_STEP_SUMMARY:-/dev/stderr}\"\n  if [ -n \"${GH_TOKEN:-}\" ] && [ -n \"${GITHUB_REPOSITORY:-}\" ]; then\n    title=\"\u26D4 libpve-storage-perl patch drift \u2014 re-anchor needed\"\n    num=$(gh issue list --repo \"${GITHUB_REPOSITORY}\" --state open \\\n      --search \"in:title \\\"${title}\\\"\" --json number -q '.[0].number' \\\n      2>/dev/null || true)\n    if [ -n \"${num}\" ]; then\n      gh issue comment \"${num}\" --repo \"${GITHUB_REPOSITORY}\" \\\n        --body \"${reason} (run ${GITHUB_RUN_ID:-?})\" 2>/dev/null || true\n    else\n      gh issue create --repo \"${GITHUB_REPOSITORY}\" --title \"${title}\" \\\n        --body \"${reason} (run ${GITHUB_RUN_ID:-?})\" 2>/dev/null || true\n    fi\n  fi\n  rc=3\n}\n\nrc=0\n# Pool creation (API/GUI \"Create: ZFS\"): insert -m /mnt/<pool> before the\n# pool name; options precede it (how zpool create parses them).\ngrep -qF '\"ashift=$ashift\", $name];' \"$Z\" \\\n  || skip_pkg \"zpool create anchor not found (API2/Disks/ZFS.pm changed)\"\n[ \"$rc\" -ne 3 ] && sed -i \\\n  's@my $cmd = \\[$ZPOOL, '\\''create'\\'', '\\''-o'\\'', \"ashift=$ashift\", $name\\];@my $cmd = [$ZPOOL, '\\''create'\\'', '\\''-o'\\'', \"ashift=$ashift\", '\\''-m'\\'', \"/mnt/$name\", $name];@' \\\n  \"$Z\"\n[ \"$rc\" -ne 3 ] && grep -qF '\"/mnt/$name\", $name];' \"$Z\" \\\n  || [ \"$rc\" -eq 3 ] \\\n  || skip_pkg \"zpool create -m patch did not apply (API2/Disks/ZFS.pm)\"\n\n# ZFSPoolPlugin path() fallback: never resolve volumes onto the read-only\n# root when a pool has no explicit mountpoint.\n[ \"$rc\" -ne 3 ] && grep -qF 'my $mountpoint = $scfg->{mountpoint} // \"/$scfg->{pool}\";' \\\n  \"$PP\" \\\n  || [ \"$rc\" -eq 3 ] \\\n  || skip_pkg \"path() fallback anchor not found (Storage/ZFSPoolPlugin.pm changed)\"\n[ \"$rc\" -ne 3 ] && sed -i 's@// \"/$scfg->{pool}\";@// \"/mnt/$scfg->{pool}\";@' \"$PP\"\n[ \"$rc\" -ne 3 ] && grep -qF 'my $mountpoint = $scfg->{mountpoint} // \"/mnt/$scfg->{pool}\";' \\\n  \"$PP\" \\\n  || [ \"$rc\" -eq 3 ] \\\n  || skip_pkg \"path() fallback patch did not apply (Storage/ZFSPoolPlugin.pm)\"\n\n# Compile-check the two patched modules (extracted tree added to @INC for\n# its own PVE:: siblings; libpve-common-perl et al. installed above).\nif [ \"$rc\" -ne 3 ]; then\n  PERL5INC=\"$(dirname \"$(dirname \"$Z\")\")\"\n  perl -I \"$PERL5INC\" -c \"$Z\" >/dev/null 2>&1 \\\n    || skip_pkg \"API2/Disks/ZFS.pm fails perl -c after patching\"\n  [ \"$rc\" -ne 3 ] && perl -I \"$PERL5INC\" -c \"$PP\" >/dev/null 2>&1 \\\n    || [ \"$rc\" -eq 3 ] \\\n    || skip_pkg \"Storage/ZFSPoolPlugin.pm fails perl -c after patching\"\nfi\n\nif [ \"$rc\" -eq 3 ]; then\n  echo \"libpve-storage-perl skipped (patch drift) \u2014 last-good +bootc build retained.\"\n  exit 0\nelif [ \"$rc\" -ne 0 ]; then\n  exit \"$rc\"\nfi\n\n# Regenerate md5sums after content modification\nfind /output/libpve-storage-perl -not -path '*/DEBIAN/*' -type f \\\n  | xargs md5sum \\\n  | sed \"s|/output/libpve-storage-perl/||\" \\\n  > /output/libpve-storage-perl/DEBIAN/md5sums\n\n# The +dcve suffix marks the ZFS mountpoint patch (distinct from the\n# plain +bootc repacks) so hosts can hold/pin on it via version checks.\nsed -i \"s/^Version: .*/Version: 1:${ORIG_VER}+dcve1/\" \\\n  /output/libpve-storage-perl/DEBIAN/control\n\ndpkg-deb --build /output/libpve-storage-perl \\\n  /debs/libpve-storage-perl_${ORIG_VER}+dcve1_${ARCH}.deb\n"
- name: pve-manager
  upstream: pve-manager
  sources:
  - pve-manager
  build: "SAVE_PWD=$(pwd)\n\napt update\n# nodejs: the patch script runs `node --check` on the patched web UI JS.\napt install -y --no-install-recommends nodejs\ncd /tmp\napt-get download pve-manager\n\nmkdir -p /output/pve-manager\ndpkg-deb -R /tmp/pve-manager_*.deb /output/pve-manager\n\nORIG_VER=$(dpkg-deb -f /tmp/pve-manager_*.deb Version)\nARCH=$(dpkg-deb -f /tmp/pve-manager_*.deb Architecture)\n\n# Guarded patches: suppress the no-subscription popup (Subscription.pm)\n# and set the GUI create-wizard VM defaults (agent/OVMF/q35) to match the\n# qemu-server backend. Exit 3 => a patch anchor drifted upstream: skip\n# this deb (keep the last-good +bootc build, never ship the unpatched\n# upstream) without failing the pipeline; the script already surfaced the\n# reason in the step summary + a GitHub issue.\nset +e\nbash \"${SAVE_PWD}/workflows/bootc-debs-builder/pve-manager/patch-defaults.sh\" \\\n  /output/pve-manager\nrc=$?\nset -e\nif [ \"$rc\" -eq 3 ]; then\n  echo \"pve-manager skipped (patch drift) \u2014 last-good version retained.\"\n  exit 0\nelif [ \"$rc\" -ne 0 ]; then\n  exit \"$rc\"\nfi\n\n# Regenerate md5sums after content modification\nfind /output/pve-manager -not -path '*/DEBIAN/*' -type f \\\n  | xargs md5sum \\\n  | sed \"s|/output/pve-manager/||\" \\\n  > /output/pve-manager/DEBIAN/md5sums\n\nsed -i \"s/^Version: .*/Version: 1:${ORIG_VER}+bootc1/\" \\\n  /output/pve-manager/DEBIAN/control\n\ndpkg-deb --build /output/pve-manager \\\n  /debs/pve-manager_${ORIG_VER}+bootc1_${ARCH}.deb\n"
- name: qemu-server
  upstream: qemu-server
  sources:
  - qemu-server
  build: "SAVE_PWD=$(pwd)\n\napt update\ncd /tmp\napt-get download qemu-server\n\nO=/output/qemu-server\nmkdir -p \"$O\"\ndpkg-deb -R /tmp/qemu-server_*.deb \"$O\"\n\nORIG_VER=$(dpkg-deb -f /tmp/qemu-server_*.deb Version)\nARCH=$(dpkg-deb -f /tmp/qemu-server_*.deb Architecture)\n\n# Guarded default patches. Exit 3 => an upstream refactor moved a patch\n# anchor: skip this deb (keep the last-good +bootc build, never ship the\n# unpatched upstream) without failing the pipeline; the script already\n# surfaced the reason in the step summary + a GitHub issue.\nset +e\nbash \"${SAVE_PWD}/workflows/bootc-debs-builder/qemu-server/patch-defaults.sh\" \"$O\"\nrc=$?\nset -e\nif [ \"$rc\" -eq 3 ]; then\n  echo \"qemu-server skipped (patch drift) \u2014 last-good version retained.\"\n  exit 0\nelif [ \"$rc\" -ne 0 ]; then\n  exit \"$rc\"\nfi\n\n# Regenerate md5sums after content modification\nfind \"$O\" -not -path '*/DEBIAN/*' -type f \\\n  | xargs md5sum \\\n  | sed \"s|$O/||\" \\\n  > \"$O/DEBIAN/md5sums\"\n\nsed -i \"s/^Version: .*/Version: 1:${ORIG_VER}+bootc1/\" \"$O/DEBIAN/control\"\n\ndpkg-deb --build \"$O\" \\\n  /debs/qemu-server_${ORIG_VER}+bootc1_${ARCH}.deb\n"
- name: proxmox-kernel-helper
  upstream: proxmox-kernel-helper
  build: "apt update\ncd /tmp\napt-get download proxmox-kernel-helper\n\nO=/output/proxmox-kernel-helper\nmkdir -p \"$O\"\ndpkg-deb -R /tmp/proxmox-kernel-helper_*.deb \"$O\"\n\nORIG_VER=$(dpkg-deb -f /tmp/proxmox-kernel-helper_*.deb Version)\nARCH=$(dpkg-deb -f /tmp/proxmox-kernel-helper_*.deb Architecture)\n\n# proxmox-boot-tool's job \u2014 owning the ESP bootloader and syncing kernels\n# onto it (incl. multi-ESP redundancy) \u2014 is exactly bootupd's job, and\n# bootc MANDATES bootupd (it runs it on every install). Two ESP managers\n# are mutually exclusive, so on a bootc image proxmox-boot-tool is\n# superseded and can never be the active bootloader manager: it is out of\n# scope here. We therefore drop only its automatic boot integration (the\n# grub-install diversion, the grub.d / initramfs / kernel ESP-sync hooks,\n# and the dpkg triggers that fire them) which would otherwise contend with\n# bootupd over the ESP. The proxmox-boot-tool binary itself and the kernel\n# NeverAutoRemove hooks (proxmox-auto-removal) are kept, and the proxmox-ve\n# dependency stays satisfied. The deb's md5sums are regenerated below so the\n# repacked package stays consistent (re-signed).\n\n# 1. Drop the grub-install wrapper and the proxmox-boot-tool hooks.\nrm -f \\\n  \"$O/usr/sbin/grub-install\" \\\n  \"$O/etc/grub.d/000_proxmox_boot_header\" \\\n  \"$O/etc/initramfs/post-update.d/proxmox-boot-sync\" \\\n  \"$O/etc/kernel/postinst.d/zz-proxmox-boot\" \\\n  \"$O/etc/kernel/postrm.d/zz-proxmox-boot\"\n\n# 2. No dpkg triggers: the package must not react to grub/shim changes.\nrm -f \"$O/DEBIAN/triggers\"\n\n# 3. Keep only the two proxmox-auto-removal conffiles.\nprintf '%s\\n' \\\n  /etc/kernel/postinst.d/proxmox-auto-removal \\\n  /etc/kernel/postrm.d/proxmox-auto-removal \\\n  > \"$O/DEBIAN/conffiles\"\n\n# 4. Neutral maintainer scripts: no grub-install diversion, no\n#    proxmox-boot-tool reinit. The kept conffiles are managed by dpkg\n#    directly and need no registration.\nfor s in preinst postinst prerm postrm; do\n  printf '#!/bin/sh\\nset -e\\nexit 0\\n' > \"$O/DEBIAN/$s\"\n  chmod 0755 \"$O/DEBIAN/$s\"\ndone\n\n# Guard: the grub-install wrapper and dpkg triggers must be gone.\ntest ! -e \"$O/usr/sbin/grub-install\" \\\n  || { echo \"ERROR: grub-install wrapper still present.\" >&2; exit 1; }\ntest ! -e \"$O/DEBIAN/triggers\" \\\n  || { echo \"ERROR: dpkg triggers still present.\" >&2; exit 1; }\n\n# Regenerate md5sums after content modification\nfind \"$O\" -not -path '*/DEBIAN/*' -type f \\\n  | xargs md5sum \\\n  | sed \"s|$O/||\" \\\n  > \"$O/DEBIAN/md5sums\"\n\nsed -i \"s/^Version: .*/Version: 1:${ORIG_VER}+bootc1/\" \"$O/DEBIAN/control\"\n\ndpkg-deb --build \"$O\" \\\n  /debs/proxmox-kernel-helper_${ORIG_VER}+bootc1_${ARCH}.deb\n"
- name: fanctl
  sources:
  - fanctl
  env:
    FANCTL_VER: 1.2.1
  build: "SAVE_PWD=$(pwd)\n\nmkdir -p /output/fanctl\ncp -r \"${SAVE_PWD}\"/workflows/bootc-debs-builder/fanctl/* /output/fanctl/\n\nchmod 0755 /output/fanctl/usr/sbin/fanctl\nchmod 0755 /output/fanctl/DEBIAN/postinst\n\nsed -i \\\n  -e \"s|{{ VER }}|${FANCTL_VER}|g\" \\\n  -e \"s|, {{ DEPS }}||g\" \\\n  /output/fanctl/DEBIAN/control\n\n# Content check: template expanded + scripts present/executable/valid.\no=/output/fanctl\n! grep -q '{{' \"${o}/DEBIAN/control\" \\\n  || { echo \"ERROR: fanctl control has unexpanded template\" >&2; exit 1; }\nfor f in \"${o}/usr/sbin/fanctl\" \"${o}/DEBIAN/postinst\"; do\n  test -x \"${f}\" \\\n    || { echo \"ERROR: fanctl ${f} missing/not exec\" >&2; exit 1; }\n  if head -1 \"${f}\" | grep -qE '^#!.*sh'; then\n    bash -n \"${f}\" \\\n      || { echo \"ERROR: fanctl ${f} shell syntax\" >&2; exit 1; }\n  fi\ndone\n\ndpkg-deb --build /output/fanctl \\\n  /debs/fanctl_${FANCTL_VER}_all.deb\n"
- name: powerctl
  sources:
  - powerctl
  env:
    POWERCTL_VER: 1.1.0
  build: "SAVE_PWD=$(pwd)\n\nmkdir -p /output/powerctl\ncp -r \"${SAVE_PWD}\"/workflows/bootc-debs-builder/powerctl/* /output/powerctl/\n\nchmod 0755 /output/powerctl/usr/sbin/powerctl\nchmod 0755 /output/powerctl/DEBIAN/postinst\n\nsed -i \\\n  -e \"s|{{ VER }}|${POWERCTL_VER}|g\" \\\n  -e \"s|, {{ DEPS }}||g\" \\\n  /output/powerctl/DEBIAN/control\n\n# Content check: template expanded + scripts present/executable/valid.\no=/output/powerctl\n! grep -q '{{' \"${o}/DEBIAN/control\" \\\n  || { echo \"ERROR: powerctl control has unexpanded template\" >&2; exit 1; }\nfor f in \"${o}/usr/sbin/powerctl\" \"${o}/DEBIAN/postinst\"; do\n  test -x \"${f}\" \\\n    || { echo \"ERROR: powerctl ${f} missing/not exec\" >&2; exit 1; }\n  if head -1 \"${f}\" | grep -qE '^#!.*sh'; then\n    bash -n \"${f}\" \\\n      || { echo \"ERROR: powerctl ${f} shell syntax\" >&2; exit 1; }\n  fi\ndone\n\ndpkg-deb --build /output/powerctl \\\n  /debs/powerctl_${POWERCTL_VER}_all.deb\n"
- name: dc-firewall-seed
  sources:
  - dc-firewall-seed
  env:
    DC_FIREWALL_SEED_VER: 1.0.0
  build: "SAVE_PWD=$(pwd)\n\nmkdir -p /output/dc-firewall-seed\ncp -r \"${SAVE_PWD}\"/workflows/bootc-debs-builder/dc-firewall-seed/* /output/dc-firewall-seed/\n\nchmod 0755 /output/dc-firewall-seed/usr/sbin/dc-firewall-seed\nchmod 0755 /output/dc-firewall-seed/DEBIAN/postinst\n\nsed -i \\\n  -e \"s|{{ VER }}|${DC_FIREWALL_SEED_VER}|g\" \\\n  -e \"s|, {{ DEPS }}||g\" \\\n  /output/dc-firewall-seed/DEBIAN/control\n\n# Content check: template expanded + scripts present/executable/valid.\no=/output/dc-firewall-seed\n! grep -q '{{' \"${o}/DEBIAN/control\" \\\n  || { echo \"ERROR: dc-firewall-seed control unexpanded template\" >&2; exit 1; }\nfor f in \"${o}/usr/sbin/dc-firewall-seed\" \"${o}/DEBIAN/postinst\"; do\n  test -x \"${f}\" \\\n    || { echo \"ERROR: dc-firewall-seed ${f} missing/not exec\" >&2; exit 1; }\n  if head -1 \"${f}\" | grep -qE '^#!.*sh'; then\n    bash -n \"${f}\" \\\n      || { echo \"ERROR: dc-firewall-seed ${f} shell syntax\" >&2; exit 1; }\n  fi\ndone\n\ndpkg-deb --build /output/dc-firewall-seed \\\n  /debs/dc-firewall-seed_${DC_FIREWALL_SEED_VER}_all.deb\n"
- name: dc-config-zfs
  sources:
  - dc-config-zfs
  env:
    DC_CONFIG_ZFS_VER: 1.0.0
