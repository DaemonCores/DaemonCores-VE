# Package manifest for the bootc .deb builder.
# One entry per package CLASS (Gabriel spec 2026-10-30): the variants
# mechanism (same as the kernel entries) expands one build script across
# every package of the class — zero duplicated YAML. Downstream, the
# manifest-expand action resolves each variant into a plain package entry.
#
# Shared deb logic: DaemonCores-CI scripts/deb_helpers.sh, imported
# implicitly by build-deb.sh (once, for every build) — no helper plumbing
# appears in the build blocks. The overlay model: package dirs mirror the deb tree
# (variant-source: "{variant}" hashes each mirror); modified upstream files
# are git .patch at the mirrored path; all-or-nothing dry-run first; .patch
# is never shipped. Drift = the deb build is skipped, the last-good deb is
# retained by build-deb.sh.
#
# HELPERS_VER is hashed per entry; bump it whenever the DaemonCores-CI deb
# helpers change (other repository, invisible to the content hash).
packages:
  - name: repacked
    variant-env: PKG
    variant-source: "{variant}"
    env:
      HELPERS_VER: 1
    build: |
      set -euo pipefail
      deb_repack "${PKG}" "${VER_SUFFIX}" "${PKG}"
    deb-glob: "{variant}_*"
    variants:
      libtemplate-perl:
        env:
          PKG: libtemplate-perl
          VER_SUFFIX: +bootc1
      libpve-storage-perl:
        env:
          PKG: libpve-storage-perl
          VER_SUFFIX: +dcve1
      pve-manager:
        env:
          PKG: pve-manager
          VER_SUFFIX: +bootc1
      qemu-server:
        env:
          PKG: qemu-server
          VER_SUFFIX: +bootc1

  - name: overlay-tree
    variant-env: PKG
    variant-source: "{variant}"
    env:
      HELPERS_VER: 1
    build: |
      set -euo pipefail
      deb_overlay_tree "${PKG}" "${VER_SUFFIX}" "${PKG}" ${EXTRA_EXEC:-}
    deb-glob: "{variant}_*"
    variants:
      ifupdown2:
        env:
          PKG: ifupdown2
          VER_SUFFIX: +bootc5
          EXTRA_EXEC: usr/sbin/ifupdown2-autoconf usr/sbin/domain-set
        upstream: ifupdown2
      chrony:
        env:
          PKG: chrony
          VER_SUFFIX: +bootc2
        upstream: chrony
      openipmi:
        env:
          PKG: openipmi
          VER_SUFFIX: +bootc1
        upstream: openipmi

  - name: custom
    variant-env: PKG
    variant-source: "{variant}"
    env:
      HELPERS_VER: 1
    build: |
      set -euo pipefail
      deb_custom "${PKG}" "${PKG_VER}" "${PKG}"
    deb-glob: "{variant}_*"
    variants:
      fanctl:
        env:
          PKG: fanctl
          PKG_VER: 1.2.1
      powerctl:
        env:
          PKG: powerctl
          PKG_VER: 1.1.0
      dc-firewall-seed:
        env:
          PKG: dc-firewall-seed
          PKG_VER: 1.0.0
      dc-config-zfs:
        env:
          PKG: dc-config-zfs
          PKG_VER: 1.0.0
      dc-zramctl:
        env:
          PKG: dc-zramctl
          PKG_VER: 1.0.0
      pvect-ostree:
        env:
          PKG: pvect-ostree
          PKG_VER: 1.0.0
      compose2bootc:
        env:
          PKG: compose2bootc
          PKG_VER: 0.1.0

  - name: helper-entry
    variant-env: PKG
    variant-source: "{variant}"
    env:
      HELPERS_VER: 1
    build: |
      set -euo pipefail
      # Bespoke content surgery (temporary inline form, PENDING: the grub /
      # triggers removal becomes a mirror tree + deletion .patch like the
      # other repacks once generated against a pristine tree).
      O=/output/${PKG}
      mkdir -p "$O"
      dpkg-deb -R /tmp/${PKG}_*.deb "$O"
      rm -f \
        "$O/usr/sbin/grub-install" \
        "$O/etc/grub.d/000_proxmox_boot_header" \
        "$O/etc/initramfs/post-update.d/proxmox-boot-sync" \
        "$O/etc/kernel/postinst.d/zz-proxmox-boot" \
        "$O/etc/kernel/postrm.d/zz-proxmox-boot" \
        "$O/DEBIAN/triggers"
      for s in preinst postinst prerm postrm; do
        printf '#!/bin/sh\nset -e\nexit 0\n' > "$O/DEBIAN/$s"
        chmod 0755 "$O/DEBIAN/$s"
      done
      printf '%s\n' \
        /etc/kernel/postinst.d/proxmox-auto-removal \
        /etc/kernel/postrm.d/proxmox-auto-removal \
        > "$O/DEBIAN/conffiles"
      test ! -e "$O/usr/sbin/grub-install" \
        && test ! -e "$O/DEBIAN/triggers"
      ORIG_VER=$(dpkg-deb -f "/tmp/${PKG}_*.deb" Version)
      ARCH=$(dpkg-deb -f "/tmp/${PKG}_*.deb" Architecture)
      find "$O" -not -path '*/DEBIAN/*' -type f \
        | xargs md5sum \
        | sed "s|$O/||" \
        > "$O/DEBIAN/md5sums"
      sed -i "s/^Version: .*/Version: 1:${ORIG_VER}+bootc1/" "$O/DEBIAN/control"
      dpkg-deb --build "$O" \
        "/debs/${PKG}_${ORIG_VER}+bootc1_${ARCH}.deb"
    deb-glob: "{variant}_*"
    variants:
      proxmox-kernel-helper:
        env:
          PKG: proxmox-kernel-helper
        upstream: proxmox-kernel-helper