# Package manifest for the bootc .deb builder.
# One entry per package. Consumed by the generic bootc-debs-builder workflow
# (setup computes dependency waves) and by the build-one-deb reusable workflow.
#   name       logical package name
#   upstream   apt package to repack (omit for from-source / custom packages)
#   deps       packages that must be built+installed first (creates a wave)
#   sources    paths under workflows/bootc-debs-builder/ hashed for change
#   deb-glob   output deb glob when it differs from <name>_* (also per-variant)
#   env        non-secret KEY: VALUE exported for the build (also hashed)
#   secret-env ENV_VAR: SECRET_NAME injected from secrets (never hashed)
#   build      the exact build script, verbatim
# Shared deb logic: DaemonCores-CIscripts/deb_helpers.sh, exported via
# CI_SCRIPTS (overlay mirror + git .patch at the mirrored path, all-or-
# nothing dry-run first; .patch never shipped). Package dirs mirror the deb
# tree: whole-tree customs (deb_custom), pure overlay trees
# (deb_overlay_tree), patched upstream repacks (deb_repack).
#
# NOTE: HELPERS_VER is hashed with the entry; bump it whenever the
# DaemonCores-CI deb helpers change (they live in another repository, so
# the content hash does not see them).
packages:
  - name: ifupdown2
    upstream: ifupdown2
    sources:
      - ifupdown2postinstall
    env:
      PKG: ifupdown2
      VER_SUFFIX: +bootc5
      TREE_DIR: ifupdown2postinstall
      HELPERS_VER: 1
    build: |
      set -euo pipefail
      . "${CI_SCRIPTS:?}/deb_helpers.sh"
      deb_overlay_tree "${PKG}" "${VER_SUFFIX}" "${TREE_DIR}" \
        usr/sbin/ifupdown2-autoconf usr/sbin/domain-set

  - name: chrony
    upstream: chrony
    sources:
      - chronypostinstall
    env:
      PKG: chrony
      VER_SUFFIX: +bootc2
      TREE_DIR: chronypostinstall
      HELPERS_VER: 1
    build: |
      set -euo pipefail
      . "${CI_SCRIPTS:?}/deb_helpers.sh"
      deb_overlay_tree "${PKG}" "${VER_SUFFIX}" "${TREE_DIR}"

  - name: openipmi
    upstream: openipmi
    sources:
      - openipmipostinstall
    env:
      PKG: openipmi
      VER_SUFFIX: +bootc1
      TREE_DIR: openipmipostinstall
      HELPERS_VER: 1
    build: |
      set -euo pipefail
      . "${CI_SCRIPTS:?}/deb_helpers.sh"
      deb_overlay_tree "${PKG}" "${VER_SUFFIX}" "${TREE_DIR}"

  - name: libtemplate-perl
    upstream: libtemplate-perl
    sources:
      - libtemplate-perl
    env:
      PKG: libtemplate-perl
      VER_SUFFIX: +bootc1
      HELPERS_VER: 1
    build: |
      set -euo pipefail
      . "${CI_SCRIPTS:?}/deb_helpers.sh"
      deb_repack "${PKG}" "${VER_SUFFIX}" "${PKG}"

  - name: libpve-storage-perl
    upstream: libpve-storage-perl
    sources:
      - libpve-storage-perl
    env:
      PKG: libpve-storage-perl
      VER_SUFFIX: +dcve1
      HELPERS_VER: 1
    build: |
      set -euo pipefail
      . "${CI_SCRIPTS:?}/deb_helpers.sh"
      deb_repack "${PKG}" "${VER_SUFFIX}" "${PKG}"

  - name: pve-manager
    upstream: pve-manager
    sources:
      - pve-manager
    env:
      PKG: pve-manager
      VER_SUFFIX: +bootc1
      HELPERS_VER: 1
