  - name: proxmox-kernel-helper
    upstream: proxmox-kernel-helper
    sources:
      - lib/deb-overlays.sh
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)

      . "${SAVE_PWD}/workflows/bootc-debs-builder/lib/deb-overlays.sh"

      apt-get update
      cd /tmp
      apt-get download proxmox-kernel-helper

      ORIG_VER=$(dpkg-deb -f /tmp/proxmox-kernel-helper_*.deb Version)
      ARCH=$(dpkg-deb -f /tmp/proxmox-kernel-helper_*.deb Architecture)

      # Bespoke content surgery (temporary inline, PENDING: becomes a mirror
      # tree + deletion .patch like the other repacks once generated against a
      # pristine tree).
      O=/output/proxmox-kernel-helper
      mkdir -p "$O"
      dpkg-deb -R /tmp/proxmox-kernel-helper_*.deb "$O"

      rm -f \
        "$O/usr/sbin/grub-install" \
        "$O/etc/grub.d/000_proxmox_boot_header" \
        "$O/etc/initramfs/post-update.d/proxmox-boot-sync" \
        "$O/etc/kernel/postinst.d/zz-proxmox-boot" \
        "$O/etc/kernel/postrm.d/zz-proxmox-boot" \
        "$O/DEBIAN/triggers"
      for s in preinst postinst prerm postrm; do
        printf '#!/bin/sh\nset -e\nexit 0\n' > "$O/DEBIAN/$s"
        chmod 0755 "$O/DEBIAN/$s"
      done
      printf '%s\n' \
        /etc/kernel/postinst.d/proxmox-auto-removal \
        /etc/kernel/postrm.d/proxmox-auto-removal \
        > "$O/DEBIAN/conffiles"

      test ! -e "$O/usr/sbin/grub-install" \
        && test ! -e "$O/DEBIAN/triggers"

      find "$O" -not -path '*/DEBIAN/*' -type f \
        | xargs md5sum \
        | sed "s|$O/||" \
        > "$O/DEBIAN/md5sums"

      sed -i "s/^Version: .*/Version: 1:${ORIG_VER}+bootc1/" "$O/DEBIAN/control"

      dpkg-deb --build "$O" \
        /debs/proxmox-kernel-helper_${ORIG_VER}+bootc1_${ARCH}.deb

  - name: fanctl
    sources:
      - fanctl
      - lib/deb-overlays.sh
    env:
      FANCTL_VER: "1.2.1"
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)

      . "${SAVE_PWD}/workflows/bootc-debs-builder/lib/deb-overlays.sh"

      deb_custom fanctl "${FANCTL_VER}" fanctl

