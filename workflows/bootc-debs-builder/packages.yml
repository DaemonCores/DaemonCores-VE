      set -euo pipefail
      . "${CI_SCRIPTS:?}/deb_helpers.sh"
      deb_repack "${PKG}" "${VER_SUFFIX}" "${PKG}"

  - name: qemu-server
    upstream: qemu-server
    sources:
      - qemu-server
    env:
      PKG: qemu-server
      VER_SUFFIX: +bootc1
      HELPERS_VER: 1
