# Package manifest for the bootc .deb builder.
# One entry per package CLASS (Gabriel spec 2026-10-30): the variants
# mechanism (same as the kernel entries) expands one build script across
# every package of the class — zero duplicated YAML. Downstream, the
# manifest-expand action resolves each variant into a plain package entry.
#
# Shared deb logic: DaemonCores-CI scripts/deb_helpers.sh, imported
# implicitly (strict mode enforced by build-deb.sh: -euo pipefail) by build-deb.sh (once, for every build) — no helper plumbing
# appears in the build blocks. The overlay model: package dirs mirror the deb tree
# (variant-source: "{variant}" hashes each mirror); modified upstream files
# are git .patch at the mirrored path; all-or-nothing dry-run first; .patch
# is never shipped. Drift = the deb build is skipped, the last-good deb is
# retained by build-deb.sh.
#
# HELPERS_VER is hashed per entry; bump it whenever the DaemonCores-CI deb
# helpers change (other repository, invisible to the content hash).
packages:
  - name: repacked
    variant-env: PKG
    variant-source: "{variant}"
    env:
      HELPERS_VER: 6
    build: |
      deb_repack "${PKG}" "${VER_SUFFIX}" "${PKG}"
    deb-glob: "{variant}_*"
    variants:
      pve-manager:
        env:
          PKG: pve-manager
          VER_SUFFIX: +dcve2
  #
  # The OTHER repacks (libtemplate-perl, libpve-storage-perl, qemu-server,
  # proxmox-kernel-helper) and the fix overlays (chrony, openipmi) build in
  # the vanilla proxmox-ve-bootc repository only (+bootc1); the fork consumes
  # them through the base image. No deb is built twice: the fork overlay of
  # pve-manager is the vanilla fix set PLUS the fork-only Bootc API modules
  # and the pvect payload, and the +dcve2 suffix keeps the fork deb strictly
  # newer than the vanilla +bootc1 repack, so a fork image built FROM the
  # proxmox-ve-bootc base upgrades pve-manager to the fork build.

  # class overlay-tree of the fork: the fork's own overlay builds only.
  # ifupdown2 carries the fork exec tools (ifupdown2-autoconf, domain-set,
  # the hosts.tpl rendering and the networking.service drop-ins).
  - name: overlay-tree
    variant-env: PKG
    variant-source: "{variant}"
    env:
      HELPERS_VER: 7
    build: |
      deb_overlay_tree "${PKG}" "${VER_SUFFIX}" "${PKG}" ${EXTRA_EXEC:-}
    deb-glob: "{variant}_*"
    variants:
      ifupdown2:
        env:
          PKG: ifupdown2
          VER_SUFFIX: +bootc5
          EXTRA_EXEC: usr/sbin/ifupdown2-autoconf usr/sbin/domain-set
        upstream: ifupdown2

  - name: custom
    variant-env: PKG
    variant-source: "{variant}"
    env:
      HELPERS_VER: 6
    build: |
      deb_custom "${PKG}" "${PKG_VER}" "${PKG}"
    deb-glob: "{variant}_*"
    variants:
      fanctl:
        env:
          PKG: fanctl
          PKG_VER: 1.2.1
      powerctl:
        env:
          PKG: powerctl
          PKG_VER: 1.1.0
      dc-firewall-seed:
        env:
          PKG: dc-firewall-seed
          PKG_VER: 1.0.0
      dc-config-zfs:
        env:
          PKG: dc-config-zfs
          PKG_VER: 1.0.0
      dc-zramctl:
        env:
          PKG: dc-zramctl
          PKG_VER: 1.0.0
      pvect-ostree:
        env:
          PKG: pvect-ostree
          PKG_VER: 1.0.0
      compose2bootc:
        env:
          PKG: compose2bootc
          PKG_VER: 0.1.0
      dc-gpu-lxc:
        env:
          PKG: dc-gpu-lxc
          PKG_VER: 1.0.0

  - name: source-build
    variant-env: PKG
    variant-source: "{variant}-src"
    env:
      HELPERS_VER: 6
    build: |
      deb_source_build "${PKG}" "${UP_COMMIT}" "${SRC_VER}" "${PKG}-src" pve-cluster libpve-cluster-api-perl
    deb-glob: "{variant}_*"
    variants:
      pve-cluster:
        env:
          PKG: pve-cluster
          UP_COMMIT: 66c87e0e7587a247f879f6f59e3bb5f3dd008e1f
          SRC_VER: 9.1.7.1+dcve1
