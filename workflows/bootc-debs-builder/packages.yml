- name: compose2bootc
  sources:
  - compose2bootc
  env: "COMPOSE2BOOTC_VER: 0.1.0"
  build: "SAVE_PWD=$(pwd)\n\nmkdir -p /output/compose2bootc\ncp -r \"${SAVE_PWD}\"/workflows/bootc-debs-builder/compose2bootc/* /output/compose2bootc/\n\nchmod 0755 /output/compose2bootc/usr/sbin/compose2bootc\nchmod 0755 /output/compose2bootc/DEBIAN/postinst\n\nsed -i \\\n  -e \"s|{{ VER }}|${COMPOSE2BOOTC_VER}|g\" \\\n  -e \"s|, {{ DEPS }}||g\" \\\n  /output/compose2bootc/DEBIAN/control\n\n# Content check: template expanded + scripts present/executable/valid.\no=/output/compose2bootc\n! grep -q '{{' \"${o}/DEBIAN/control\" \\\n  || { echo \"ERROR: compose2bootc control unexpanded template\" >&2; exit 1; }\nfor f in \"${o}/usr/sbin/compose2bootc\" \"${o}/DEBIAN/postinst\"; do\n  test -x \"${f}\" \\\n    || { echo \"ERROR: compose2bootc ${f} missing/not exec\" >&2; exit 1; }\n  if head -1 \"${f}\" | grep -qE '^#!.*sh'; then\n    bash -n \"${f}\" \\\n      || { echo \"ERROR: compose2bootc ${f} shell syntax\" >&2; exit 1; }\n  fi\ndone\n\ndpkg-deb --build /output/compose2bootc \\\n  /debs/compose2bootc_${COMPOSE2BOOTC_VER}_all.deb\n"
