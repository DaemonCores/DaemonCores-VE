# Lane-LOCAL kconfig sur-ride file of the kernel-pve build — EMPTY by
# decision (owner arbitration 2026-11-03 13:05, supersedes the 12:14/12:55
# THP never pin): the SHARED fragment's THP=ALWAYS pin wins on this lane
# too, because the default VE profile is the full-LXC one (every CT
# allocation is served in 2M/1G hugepages by the host THP). The THP=never
# profile is now an IMAGE-lane choice, carried by the thin -thpnever twin
# per flavour (karg transparent_hugepage=never + a systemd-tmpfiles `w!`
# rule, Containerfile.thpnever-*), never a second kernel build.
#
# The file stays (documentation + the optional-sur-ride precedent: the lane
# tree may carry real sur-rides again at any time) and carries NO CONFIG
# line, so the merge is a no-op and the compiled default is ALWAYS.
