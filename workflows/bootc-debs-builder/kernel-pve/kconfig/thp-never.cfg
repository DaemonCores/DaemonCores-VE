# Lane-LOCAL kconfig sur-ride of the kernel-pve build (owner arbitration
# 2026-11-03 12:55): the SHARED functional set and the GPU fragments come
# from the build engine (DaemonCores-CI build-deb/kernel-shared, exported as
# CI_KERNEL_SHARED) — this tree carries ONLY what is the PVE lane's own
# decision, NEVER a copy of the shared data.
#
# THP arbitration, PVE lane (owner, 2026-11-03 12:14 revised): THP NEVER on
# the hypervisor — the hugepage decision belongs to the GUEST (PVE memory:
# hugepages 2M/1G per VM/CT); host THP=always double-counts memory around
# guests that manage their own and breaks the balloon; the compute profile is
# tuned PER-GUEST, never on the host. MADVISE is pinned off so olddefconfig
# cannot sit between the profiles. Merged LAST so NEVER overrides the shared
# fragment's debian-lane ALWAYS pin. The -thpalways twin image (separate
# image, NOT the kernel-pve default) carries its own THP=always profile +
# karg in the image lane.
CONFIG_TRANSPARENT_HUGEPAGE=y
CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS=n
CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=n
