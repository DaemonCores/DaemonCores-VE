  - name: 0018-setlocalversion-file
    url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0018-XANMOD-scripts-setlocalversion-Move-localversion-fil.patch
    topic: xanmod
    stage: common

  # ── clearlinux topic ────────────────────────────────────────────────────
  - name: 0001-wait-lifo
    url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0001-sched-wait-Do-accept-in-LIFO-order-for-cache-efficie.patch
