# kernel-pve/patches.yml
#
# Manifest of the XanMod patch set applied over the Proxmox kernel packaging
# at build time. The patch files themselves are never committed: each entry
# names the URL of the file in the official XanMod upstream repository
# (GitLab xanmod/linux-patches, directory linux-{series}.y-xanmod/<topic>),
# and lib/kernel-pve-patches.sh downloads it. A patch that cannot be
# downloaded or does not apply fails the build; the last good deb is kept.
#
# Fields:
#   name   unique label used in logs
#   url    official upstream location; {seriesdir} is replaced by the series
#          directory (linux-7.3.y-xanmod for the 7.3 series, eol/linux-7.0.y-
#          xanmod for the archived 7.0 series the PVE packaging tracks),
#          {topic} by the topic directory
#   stage  common (every architecture) or an architecture (amd64, arm64)
#
# Official source: https://gitlab.com/xanmod/linux-patches
#   one directory per series (linux-7.3.y-xanmod, ...), one per topic, files
#   numbered and applied in lexical order. The topics listed here are the
#   core XanMod optimisation set; the mm/net/binder/userns/zen/valve topics
#   exist upstream and are NOT applied — they change policy, not throughput
#   knobs the host needs, and each addition must re-verify the applicability
#   on the PVE packaging tree.
#
# Generated from the live GitLab tree on 2026-10-30 (series 7.3), reviewed
# 2026-10-29 for the series the PVE 9.2 packaging actually tracks:
# proxmox-kernel-7.0 (7.0.14-26) → the ARCHIVED 7.0 series, eol/linux-7.0.y-
# xanmod ({seriesdir} resolved by lib/kernel-pve-patches.sh). 21 patches:
# 18 xanmod + 3 clearlinux; 0004-ata-before-graphics (clearlinux) does not
# apply to the 7.0.x tree in either series (dry-run verified). The build
# hard-fails on any patch that cannot be downloaded or applied. A new
# packaging series means a new manifest review, not a blind bump.
patches:
  # ── xanmod topic (applied in file-number order) ─────────────────────────
  - name: 0001-x86-cflags
    url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0001-XANMOD-x86-build-Add-more-CFLAGS-optimizations.patch
    topic: xanmod
    stage: common
  # 0003-kbuild-sms-pipelining: RETIRED (probe 2026-10-29): the active 7.3
  # name and the EOL 7.0 name both fail the dry-run on the pristine PVE
  # 7.0.14 tree, so no series variant applies; re-review on a series bump.
  # 0002-kbuild-llvm-plo: PINNED to the active 7.3 file on 2026-10-29
  # (series 7.0 review): the EOL 7.0 sibling does not apply to the 7.0.x
  # tree — it depends on an XanMod-side 0001 Makefile context (dry-run
  # verified on the pristine and the 0001-patched tree), while the 7.3
  # file applies cleanly on the same tree (dry-run verified). The URL is
  # absolute (no {seriesdir}) so the series bump does not silently move
  # it; re-review on a series bump.
  - name: 0002-kbuild-llvm-plo
    url: https://gitlab.com/xanmod/linux-patches/-/raw/master/linux-7.3.y-xanmod/xanmod/0002-XANMOD-kbuild-Add-LLVM-polyhedral-loop-optimizer-fla.patch
    topic: xanmod
    stage: common
  - name: 0004-kbuild-debpkg-dbg
    url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0004-XANMOD-kbuild-deb-pkg-Create-dbg-when-make-DEB_DEBUG.patch
    topic: xanmod
    stage: common
  - name: 0005-kbuild-sign-external-cfg
    url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0005-kbuild-Re-add-.config-file-required-to-sign-external.patch
    topic: xanmod
    stage: common
  - name: 0006-fair-unscaled-tunables
    url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0006-XANMOD-fair-Set-scheduler-tunable-latencies-to-unsca.patch
    topic: xanmod
    stage: common
  - name: 0007-mq-deadline-write-prio
    url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0007-XANMOD-block-mq-deadline-Increase-write-priority-to-.patch
    topic: xanmod
    stage: common
  - name: 0008-mq-deadline-front-merges
    url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0008-XANMOD-block-mq-deadline-Disable-front_merges-by-def.patch
    topic: xanmod
    stage: common
  - name: 0009-block-rq-affinity
    url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0009-XANMOD-block-Set-rq_affinity-to-force-complete-I-O-r.patch
    topic: xanmod
    stage: common
  - name: 0010-blk-wbt-latency
