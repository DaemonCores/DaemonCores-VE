    stage: common
  - name: 0002-firmware-stateless
    url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0002-firmware-Enable-stateless-firmware-loading.patch
    topic: clearlinux
    stage: common
  - name: 0003-rwsem-spin
    url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0003-locking-rwsem-spin-faster.patch
    topic: clearlinux
    stage: common
  # 0004-ata-before-graphics REMOVED 2026-10-29 (series 7.0 review): the
  # file downloads but no longer applies to the 7.0.x tree (verified by
  # dry-run against BOTH the active 7.3 and the EOL 7.0 series) — drivers
  # initialize ata before graphics upstream now.