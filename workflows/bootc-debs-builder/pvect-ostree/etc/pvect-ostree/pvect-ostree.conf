# pvect-ostree configuration — sourced by /usr/sbin/pvect-ostree.
# Values here are defaults; every one can be overridden per invocation.

# Per-CT registry only ($STATE_DIR/<vmid>.env): the composefs sysroot lives
# INSIDE each CT rootfs volume (pvect-ostree/sysroot), never in host state.
STATE_DIR=/var/lib/pvect-ostree/cts

# Recorded compose sources ($COMPOSE_DIR/<stack>/docker-compose.yml), plus the
# payload/relocation sidecars written by `publish`.
COMPOSE_DIR=/var/lib/pvect-ostree/compose

# PVE storage backing the container rootfs subvol AND the writable mp volumes
# (/etc, /var, /usr/lib/bootc). Must have 'content rootdir'. Empty (default):
# auto-resolved as the FIRST active storage with 'content rootdir' in
# /etc/pve/storage.cfg — no machine-specific name is baked in here.
STORAGE=
ROOTFS_STORAGE=

# PVE storage for the publish seed templates (<storage>:vztmpl/*.tar.gz).
# Empty (default): auto-resolved as the vztmpl-capable storage that ALREADY
# holds templates (via pveam), else the FIRST active storage with
# 'content vztmpl' in /etc/pve/storage.cfg.
TEMPLATE_STORAGE=

# Default volumes sizes (GB) of the writable layers, allocated via the PVE
# storage API at create/migrate time.
MP_ETC_SIZE=1
MP_VAR_SIZE=16
MP_BOOTC_SIZE=16

# Per-volume storage targets of the writable layers, each optional. Empty
# (default): the writable layer follows the resolved ROOTFS_STORAGE. Set to a
# storeid to place a single layer elsewhere (declared with 'content rootdir').
MP0_STORAGE=
MP1_STORAGE=
MP2_STORAGE=

# PVE unprivileged default id-map. Do not change unless your CTs use a custom map.
UID_BASE=100000
UID_RANGE=65536

# Pinned user-namespace file used by `mount.composefs -o idmap=` (re-pinned on boot).
USERNS=/run/pvect-ostree/userns

# Fallback OCI/bootc template used only to make `pct create` allocate the rootfs
# subvol; its extracted content is discarded and replaced by the composefs view.
ALLOC_TEMPLATE_MATCH=alpine-.*amd64

# systemd units that belong to a host OS but not to a container guest; masked in
# the per-container writable /etc so the guest boots clean (no [FAILED]).
GUEST_MASK_UNITS="networking.service ifupdown2-pre.service dhcpcd.service \
wpa_supplicant.service systemd-networkd.service NetworkManager.service \
apparmor.service bootloader-update.service \
sys-kernel-config.mount sys-kernel-debug.mount"